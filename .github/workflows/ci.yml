name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test
      - run: pnpm run type-check
      - run: pnpm run build:lib
      # lib/ is only committed on a release tag (release.sh). There it must be
      # the same as a fresh build. On other commits lib/ is ignored.
      - run: git diff --exit-code -- lib
